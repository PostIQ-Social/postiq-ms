<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reset your PostIQ password</title>
</head>
<body style="margin:0; padding:32px 16px; background:#f4f7f5; color:#20332a; font-family:Arial, Helvetica, sans-serif;">
  <main style="box-sizing:border-box; width:100%; max-width:460px; margin:48px auto; padding:36px; border:1px solid #e1e9e4; border-radius:12px; background:#ffffff;">
    <header style="margin-bottom:32px; color:#205f43; font-size:20px; font-weight:700;">PostIQ</header>
    <h1 style="margin:0 0 12px; font-size:26px;">Choose a new password</h1>
    <p style="margin:0 0 26px; color:#64746b; font-size:14px; line-height:1.6;">Enter a new password for your account. Your reset link can only be used once.</p>
    <form id="reset-form">
      <label for="email" style="display:block; margin-bottom:8px; font-size:14px; font-weight:700;">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="320" style="box-sizing:border-box; width:100%; margin-bottom:20px; padding:12px; border:1px solid #cbd8d0; border-radius:6px; font:inherit;">
      <label for="new-password" style="display:block; margin-bottom:8px; font-size:14px; font-weight:700;">New password</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="200" style="box-sizing:border-box; width:100%; margin-bottom:20px; padding:12px; border:1px solid #cbd8d0; border-radius:6px; font:inherit;">
      <label for="confirm-password" style="display:block; margin-bottom:8px; font-size:14px; font-weight:700;">Confirm new password</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="200" style="box-sizing:border-box; width:100%; margin-bottom:24px; padding:12px; border:1px solid #cbd8d0; border-radius:6px; font:inherit;">
      <button id="submit-button" type="submit" style="width:100%; padding:14px; border:0; border-radius:7px; background:#205f43; color:#ffffff; font-size:15px; font-weight:700; cursor:pointer;">Update password</button>
    </form>
    <p id="status" role="status" aria-live="polite" style="margin:20px 0 0; color:#42534a; font-size:14px; line-height:1.6;"></p>
  </main>
  <script>
    const query = new URLSearchParams(window.location.search);
    const token = query.get("token");
    const form = document.getElementById("reset-form");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submit-button");

    document.getElementById("email").value = query.get("email") || "";

    if (!token) {
      form.hidden = true;
      status.textContent = "This password reset link is missing its token. Request a new reset email and try again.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const newPassword = document.getElementById("new-password").value;

      if (!token) {
        status.textContent = "This password reset link is invalid. Request a new reset email and try again.";
        return;
      }

      if (newPassword !== document.getElementById("confirm-password").value) {
        status.textContent = "The passwords do not match.";
        return;
      }

      submitButton.disabled = true;
      status.textContent = "Updating your password...";

      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, token, newPassword })
        });
        const result = await response.json();

        if (!response.ok) {
          status.textContent = result.detail || "The reset link is invalid or expired. Request a new one and try again.";
          submitButton.disabled = false;
          return;
        }

        form.hidden = true;
        status.textContent = "Your password has been updated. You can now sign in with your new password.";
      } catch {
        status.textContent = "We could not reach the server. Check your connection and try again.";
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
